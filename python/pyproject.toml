[project]
name = "dingda-sidecar"
version = "0.1.0"
description = "DingDa Python sidecar（浏览器例外能力）"
requires-python = ">=3.13"
dependencies = [
  "playwright>=1.40",
  "playwright-stealth>=2.0.3",
  "camoufox>=0.4.11",
  "segno>=1.6.6",
  "langgraph>=0.2",
  "langchain-openai>=0.3",
  "openai>=1.40",
  "websockets>=13.0",
  "msgpack>=1.0",
  "trafilatura>=2.2.0",
  "requests>=2.31",
  "loguru>=0.7.2",
  "cryptography>=42.0.0",
  "PyExecJS>=1.5.0",
  "browser-cookie3>=0.19.0",
  "qrcode>=7.4",
  "rich>=13.0",
  "pyyaml>=6.0",
  "xhshow>=0.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.13",
]

[project.scripts]
dingda-sidecar = "dingda_sidecar.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dingda_sidecar*"]
namespaces = true
