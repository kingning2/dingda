# 前端多包工作区。
#
# 注意：这里只登记前端包。Rust 侧是独立的 Cargo workspace（见根 Cargo.toml
# 的 members = ["packages-rs/*"]），两者互不干涉，不要把这个 glob 写成
# "packages*"，否则 packages-rs 会被 pnpm 当成 JS 包扫描。
packages:
  # 一级：独立于前端域的包（当前只有 contracts，与 server/ 的线协议）
  - "packages/*"
  # 二级：前端域内的功能包（packages/client/ui-* 等）
  - "packages/*/*"
  # 应用装配层（web 端）
  - "apps/*"
  # 桌面端 E2E（WebdriverIO + 应用内嵌 WebDriver，不经 tauri-driver）；
  # 不参与 scripts/check-workspace-deps.mjs 的依赖检查——那个脚本只扫 packages/ 与 apps/
  - "e2e"
allowBuilds:
  # vite/tailwind 构建链依赖 esbuild，需要 postinstall 装平台二进制
  esbuild: true
  # e2e（WebdriverIO）的传递依赖，postinstall 下载 WebDriver 驱动二进制
  edgedriver: true
  geckodriver: true
# 从根 package.json 的 pnpm.overrides 迁入：pnpm 12 不再读 package.json 的 pnpm 字段
overrides:
  "source-map-js@<1.2.2": ">=1.2.2"
