[project]
name = "dingda-v2"
version = "0.1.0"
description = "DingDa v2 — FastAPI server"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "rich>=13.0",
  "pyyaml>=6.0",
  "qrcode>=7.4",
  "pillow>=10.0",
  "playwright>=1.58",
  "camoufox[geoip]>=0.4",
  "loguru>=0.7.3",
  "requests>=2.34.2",
  "tenacity>=9.1.4",
  "browser-cookie3>=0.20.1",
  "pyexecjs>=1.5.1",
  "cryptography>=50.0.1",
  "websockets>=17.1",
  "opencv-python-headless>=5.0.0.93",
  "mcp>=1.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
]

[project.scripts]
dingda-v2 = "src.__main__:main"
dingda-mcp = "src.mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-server = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.channels.xianyu" = ["static/*.js"]

[tool.pytest.ini_options]
markers = [
  "integration: 需要本机浏览器与网络的集成测试",
]
