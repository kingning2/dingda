# Merge to main → auto tag (semver patch) → build desktop installers.
# Develop on feature branches; do not commit product work on main.

name: desktop-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require uv.lock
        run: test -f uv.lock

      - name: Compute next patch tag
        id: next
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            latest="v0.0.0"
          fi
          ver="${latest#v}"
          IFS=. read -r major minor patch <<EOF
          ${ver}
          EOF
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          # non-numeric patch (e.g. 1.0.0-beta) → start patch at 0 then +1
          if ! [[ "${patch}" =~ ^[0-9]+$ ]]; then
            patch=0
          fi
          patch=$((patch + 1))
          version="${major}.${minor}.${patch}"
          tag="v${version}"
          # idempotent: if this commit already tagged, reuse
          existing="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]' | head -n1 || true)"
          if [ -n "${existing}" ]; then
            tag="${existing}"
            version="${existing#v}"
            echo "reuse existing tag on commit: ${tag}"
          fi
          echo "latest=${latest}"
          echo "tag=${tag}"
          echo "version=${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

  desktop:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync package versions for this release
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          node -e "
          const fs = require('fs');
          const v = process.env.VERSION;
          for (const f of ['package.json', 'packages-rs/client/tauri.conf.json']) {
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = v;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          }
          const cargo = fs.readFileSync('packages-rs/client/Cargo.toml', 'utf8')
            .replace(/^version = \".*\"/m, 'version = \"' + v + '\"');
          fs.writeFileSync('packages-rs/client/Cargo.toml', cargo);
          console.log('version set to', v);
          "

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Prepare desktop runtime (uv + server + Camoufox zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CAMOUFOX: "1"
          CAMOUFOX_RELEASE_TAG: ${{ vars.CAMOUFOX_RELEASE_TAG }}
        run: pnpm prepare:desktop-runtime

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: DingDa v2 ${{ needs.tag.outputs.tag }}
          releaseBody: |
            Auto release from `main` merge.
            - Bundled uv + server (China mirrors for first-run sync)
            - Platform Camoufox zip extracted on first launch
          releaseDraft: false
          prerelease: false
