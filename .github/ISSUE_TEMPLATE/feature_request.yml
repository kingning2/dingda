name: 💡 功能建议
description: 提出新能力或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 描述你当前的工作流卡在哪里
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 期望的交互 / 界面 / 命令行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过去的？
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已搜索 Issue 列表确认没有重复
          required: true
