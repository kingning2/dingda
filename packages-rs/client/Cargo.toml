[package]
name = "client"
version = "0.1.0"
description = "DingDa v2 Tauri 客户端（壳）"
authors = ["you"]
edition = "2021"

[lib]
name = "client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
common = { path = "../common" }
python = { path = "../python" }
runtime = { path = "../runtime" }
agent = { path = "../agent" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 内嵌 W3C WebDriver 服务，供 e2e 的 embedded provider 驱动；默认不编译。
#
# 为什么用 feature 而不是 `[target.'cfg(debug_assertions)'.dependencies]`：
# Cargo 的 target 段不支持 `debug_assertions`，写了会被忽略（构建时报 warning），
# 依赖照样进 release。feature 是唯一能让 release 真正不编译它的方式。
#
# 为什么不走外部 tauri-driver：wry 在 `additional_browser_args` 为 None 时
# 会自行构造默认值并调 `set_additional_browser_arguments()`，而 WebView2 的该
# 属性优先级高于环境变量，于是 tauri-driver 注入的 `--remote-debugging-port`
# 被静默覆盖，调试端口永不打开（wry-0.55.1/src/webview2/mod.rs:294-327）。
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
default = []
# 仅供 e2e：`cargo build -p client --features e2e`
e2e = ["dep:tauri-plugin-wdio-webdriver"]
