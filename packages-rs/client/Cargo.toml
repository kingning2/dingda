[package]
name = "client"
version = "0.1.0"
description = "DingDa v2 Tauri 客户端（壳）"
authors = ["you"]
edition = "2021"

[lib]
name = "client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
common = { path = "../common" }
python = { path = "../python" }
runtime = { path = "../runtime" }
agent = { path = "../agent" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
