[project]
name = "dingda"
version = "0.1.0"
description = "DingDa AI customer service desktop platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dingda-sidecar",
]

[dependency-groups]
dev = [
  "ruff>=0.11",
]

[tool.uv.sources]
dingda-sidecar = { path = "python", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["python"]
# vendored 第三方爬虫源码不参与本仓库风格约束（见 python/crawlers/vendor/VENDOR.md）
exclude = ["**/crawlers/vendor/**"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "N",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 自动生成的契约文件：导入排序由 codegen 输出决定，格式化会随重新生成被覆盖。
"python/contracts/generated/*.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = [
  "channels",
  "contracts",
  "core",
  "sidecar",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
