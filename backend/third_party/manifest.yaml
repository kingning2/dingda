# 第三方工具登记清单
# 业务代码只通过 src.adapters 访问，勿改本文件以外的业务层代码即可升级 vendor。
#
# 字段说明：
#   path         : 相对 third_party/ 的目录名（同步后为上游整仓）
#   import_name  : Python 顶层包名
#   python_path  : 相对 vendor 根目录，加入 sys.path 后方能 import import_name
#   upstream     : 上游仓库地址与默认跟踪分支（仅 --update 时使用）
#   remove_files : 同步后删除的 CLI/MCP 入口（相对 vendor 根）
#
# 实际检出版本见 vendor.lock.yaml；日常 sync 不会自动拉 main 最新。

vendors:
  xhs_cli:
    path: xhs_cli
    import_name: xhs_cli
    python_path: .
    license: Apache-2.0
    upstream:
      repo: https://github.com/jackwener/xhs-cli
      ref: main
    remove_files:
      - xhs_cli/cli.py

  goofish_cli:
    path: goofish_cli
    import_name: goofish_cli
    python_path: src
    license: Apache-2.0
    upstream:
      repo: https://github.com/fancyboi999/goofish-cli
      ref: main
    remove_files:
      - src/goofish_cli/cli.py
      - src/goofish_cli/mcp_server.py
