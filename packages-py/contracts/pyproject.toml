[project]
name = "contracts"
version = "0.1.0"
description = "DingDa 零依赖叶子：线协议 DTO + 跨包插座（BrowserPort / Page / Cookie / LaunchOptions）。"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
