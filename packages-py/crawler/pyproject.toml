[project]
name = "crawler"
version = "0.1.0"
description = "DingDa 平台采集层：搜索 / 详情 / 解析 / Snapshot / 去重。只经 contracts 的 BrowserPort 用浏览器，禁止 import browser/playwright。"
requires-python = ">=3.13"
dependencies = [
  "channels",
  "contracts",
  "core",
  "httpx>=0.28",
  "pillow>=10.0",
  "rapidocr-onnxruntime>=1.4.0",
]

[tool.uv.sources]
channels = { workspace = true }
contracts = { workspace = true }
core = { workspace = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
