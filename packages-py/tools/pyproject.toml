[project]
name = "tools"
version = "0.1.0"
description = "DingDa Tool 边界：Agent 可调用契约 + 实现（search/product/login/snapshot…）。插座在此落地为具体实现。"
requires-python = ">=3.13"
dependencies = [
  "browser",
  "cli",
  "contracts",
  "core",
  "crawler",
  "httpx>=0.28",
  "pydantic>=2.0",
]

# 给 CLI skill 调的裸入口：skill 命令写死 ``tool <子命令>``，不再暴露解释器路径。
# runtime 需把本包 Scripts/bin 目录前置进子进程 PATH（见 cli/base.py）。
[project.scripts]
tool = "tools.cli:main"

[tool.uv.sources]
browser = { workspace = true }
cli = { workspace = true }
contracts = { workspace = true }
core = { workspace = true }
crawler = { workspace = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
