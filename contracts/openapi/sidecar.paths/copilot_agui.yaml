paths:
  /v1/copilot/agui:
    post:
      operationId: copilotAguiRun
      summary: CopilotKit task-copilot AG-UI endpoint (frontend-direct exception; SSE stream)
      description: |
        例外路径：本端点由前端 CopilotKit HttpAgent 直连（其余 sidecar 路径仅 Rust 可调）。
        Rust 仅经 pipe 提供 HTTP 端口发现（/v1/copilot/http_info），不转发业务流量。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schema/v1/copilot/run_start.request.schema.json'
      responses:
        '200':
          description: AG-UI event stream
          content:
            text/event-stream:
              schema:
                $ref: '../../schema/v1/copilot/run_start.response.schema.json'
