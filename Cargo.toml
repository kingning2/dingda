[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/desktop/src-tauri/macros",
]
exclude = ["subscription"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DingDa Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart", "stream", "cookies"] }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
md-5 = "0.10"
memmap2 = "0.9"
thiserror = "2"
fastembed = "5.17"
anyhow = "1"
