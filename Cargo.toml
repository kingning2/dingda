[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "business",
  "crates/common",
  "crates/ports",
  "crates/macros",
  "crates/infra",
  "crates/agent",
  "crates/platform",
]
exclude = ["subscription"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DingDa Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart", "stream", "cookies"] }
wreq = { version = "5.3.0", features = ["json", "cookies", "gzip"] }
wreq-util = "2.2.6"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
rand = "0.8"
schemars = "1"
enigo = "0.3"
screenshots = "0.8"
imageproc = "0.25"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rmp = "0.8"
rmpv = "1"
md-5 = "0.10"
hex = "0.4"
url = "2"
once_cell = "1"
thiserror = "2"
anyhow = "1"
