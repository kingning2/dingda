<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>DingDa v2</title>
    <style id="boot-critical">
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #ffffff;
        font-family: "Geist Variable", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(52% 44% at 12% -4%, rgba(168, 196, 236, 0.55) 0%, transparent 68%),
          radial-gradient(44% 38% at 90% 6%, rgba(240, 197, 216, 0.45) 0%, transparent 66%),
          radial-gradient(48% 42% at 82% 94%, rgba(247, 224, 196, 0.5) 0%, transparent 64%),
          radial-gradient(56% 48% at 14% 102%, rgba(213, 229, 248, 0.38) 0%, transparent 70%),
          linear-gradient(#ffffff, #ffffff);
        transition: opacity 220ms cubic-bezier(0, 0, 0.2, 1);
      }

      #boot-splash.boot-splash--out {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
        user-select: none;
      }

      .boot-splash__logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        box-shadow:
          0 1px 2px rgba(28, 27, 26, 0.05),
          0 8px 24px rgba(28, 27, 26, 0.08);
      }

      .boot-splash__title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #202020;
      }

      .boot-splash__status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #5c5c5c;
      }

      .boot-splash__spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(53, 53, 53, 0.14);
        border-top-color: #353535;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true" aria-label="叮答正在加载">
      <div class="boot-splash__inner">
        <img class="boot-splash__logo" src="/logo-mark.svg" width="52" height="52" alt="" decoding="async" />
        <div class="boot-splash__title">叮答</div>
        <div class="boot-splash__status">
          <span class="boot-splash__spinner" aria-hidden="true"></span>
          <span>正在加载…</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
